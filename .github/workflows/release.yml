name: Release

# Builds the .deb for a published GitHub Release, attaches it to the release,
# and publishes it into apt.mltz.tech (noble + resolute).
#
# Secrets live in the `apt` environment, which only accepts v* tags, so they
# are never exposed to branch or pull-request runs. The deploy key can only run
# the forced command `github-publish` on the server.

on:
  release:
    types: [published]
  # Manual rerun: "Run workflow" and pick the release tag (not a branch) under
  # "Use workflow from"; the apt environment refuses non-tag refs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      deb: ${{ steps.build.outputs.deb }}
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "run this workflow from a release tag, not a branch" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build .deb
        id: build
        run: |
          set -euo pipefail
          npm ci
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm run dist:deb
          deb="whatsapp_${TAG#v}_amd64.deb"
          test -f "dist/$deb"
          sha256sum "dist/$deb"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Attach .deb to release
        env:
          GH_TOKEN: ${{ github.token }}
          DEB: ${{ steps.build.outputs.deb }}
        run: gh release upload "$TAG" "dist/$DEB" --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/${{ steps.build.outputs.deb }}
          if-no-files-found: error
          retention-days: 7

  publish-apt:
    needs: build
    runs-on: ubuntu-24.04
    environment: apt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist

      - name: Publish to apt.mltz.tech
        env:
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_KNOWN_HOSTS: ${{ secrets.APT_KNOWN_HOSTS }}
          APT_HOST: ${{ secrets.APT_HOST }}
          DEB: ${{ needs.build.outputs.deb }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$APT_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$APT_SSH_KEY" > "$HOME/.ssh/apt_key"
          trap 'rm -f "$HOME/.ssh/apt_key"' EXIT

          # Electron bundles its own runtime, so one build serves both releases.
          for codename in resolute noble; do
            echo "Publishing $DEB into $codename"
            ssh -i "$HOME/.ssh/apt_key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes "carlos@$APT_HOST" "$codename $DEB" < "dist/$DEB"
          done
